<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Powershop TV - Pantalla</title>
    <style>
        /* Página que se pinta en la pantalla del prop (DUI) */
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
        #stage, #stage > *, #stage iframe, #stage video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
        #stage video { object-fit: contain; }
        #msg {
            position: absolute; left: 0; right: 0; bottom: 8%;
            text-align: center; color: #fff; font: 600 34px 'Segoe UI', Arial, sans-serif;
            text-shadow: 0 2px 10px #000; display: none;
        }

        /* ---- Menú de inicio (Smart TV). Medidas en vw para cualquier resolución ---- */
        #home {
            position: absolute; inset: 0; display: none; flex-direction: column;
            padding: 4.2vw 5vw 3.4vw; box-sizing: border-box; color: #f3f5f8;
            font-family: 'Segoe UI', 'Inter', system-ui, Arial, sans-serif;
            background:
                radial-gradient(ellipse 70% 60% at 85% 0%, var(--glow, rgba(0, 229, 255, 0.22)), transparent 70%),
                linear-gradient(160deg, #141826 0%, #0a0c13 60%, #06070b 100%);
        }
        #home.on { display: flex; }
        .h-top { display: flex; align-items: baseline; justify-content: space-between; }
        .h-name { font-size: 1.9vw; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.75; }
        .h-clock { font-size: 2.6vw; font-weight: 300; font-variant-numeric: tabular-nums; }
        .h-title { margin-top: 2.4vw; font-size: 4.6vw; font-weight: 700; letter-spacing: -0.01em; }
        .h-apps { margin-top: 2.6vw; display: flex; gap: 1.6vw; }
        .h-app {
            flex: 1; min-width: 0; height: 15.5vw; padding: 1.5vw; box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: space-between;
            border-radius: 1.6vw; background: var(--c);
            background-image: linear-gradient(150deg, rgba(255, 255, 255, 0.22), rgba(0, 0, 0, 0.28));
        }
        .h-app.sel { outline: 0.35vw solid #fff; outline-offset: 0.35vw; }
        .h-icon { width: 5.2vw; height: 5.2vw; }
        .h-icon svg, .h-icon img { width: 100%; height: 100%; display: block; object-fit: contain; }
        .h-label { font-size: 2.2vw; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .h-sub { margin-top: 0.3vw; font-size: 1.15vw; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .h-row-title { margin-top: 2.8vw; font-size: 1.5vw; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.6; }
        .h-channels { margin-top: 1.1vw; display: flex; flex-wrap: wrap; gap: 1vw; max-height: 9vw; overflow: hidden; }
        .h-ch { display: flex; align-items: center; gap: 0.9vw; padding: 0.8vw 1.4vw 0.8vw 0.8vw; border-radius: 5vw; background: rgba(255, 255, 255, 0.08); font-size: 1.6vw; }
        .h-ch b { width: 2.6vw; height: 2.6vw; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--accent, #00e5ff); color: #06070b; font-size: 1.4vw; }
        /* Lista de una aplicación: cabecera + rejilla de 5 columnas (se ven 2 filas) */
        .h-head { margin-top: 1.6vw; display: flex; align-items: baseline; gap: 1.6vw; }
        .h-head b { font-size: 3.4vw; font-weight: 700; }
        .h-head span { font-size: 1.7vw; opacity: 0.65; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .h-view { margin: 1.4vw -0.7vw 0; padding: 0.7vw; height: 31.4vw; overflow: hidden; }
        .h-grid { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); gap: 1.2vw 1.2vw; transition: transform 0.25s ease; }
        .h-card { min-width: 0; padding: 0.55vw; border-radius: 1.1vw; }
        .h-card.sel { background: rgba(255, 255, 255, 0.14); outline: 0.3vw solid #fff; }
        .h-thumb { position: relative; width: 100%; padding-top: 56.25%; border-radius: 0.8vw; overflow: hidden; background: #1c2030; }
        .h-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .h-thumb i { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 4vw; font-weight: 700; color: var(--accent, #00e5ff); }
        .h-ctitle { margin-top: 0.6vw; height: 3vw; overflow: hidden; font-size: 1.2vw; font-weight: 600; line-height: 1.25; }
        .h-csub { margin-top: 0.2vw; font-size: 1vw; opacity: 0.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .h-msg { margin-top: 6vw; font-size: 2.2vw; opacity: 0.8; text-align: center; line-height: 1.4; }
        .h-hint { margin-top: auto; flex-wrap: wrap; display: flex; align-items: center; gap: 0.8vw; font-size: 1.7vw; opacity: 0.8; }
        .h-hint kbd { white-space: nowrap; padding: 0.2vw 0.9vw; border: 0.15vw solid var(--accent, #00e5ff); border-radius: 0.6vw; color: var(--accent, #00e5ff); font: inherit; font-weight: 700; }
    </style>
</head>
<body>
    <div id="stage"></div>
    <div id="home"></div>
    <div id="msg"></div>
    <script src="dui.js"></script>
</body>
</html>
